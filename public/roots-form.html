<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Roots Connect &amp; Celebrate 2026 registration</title>
  </head>
  <body>
    <p><a href="/roots#registration">Register for Roots Connect</a></p>
    <!-- Netlify detects the fields here before the React application runs. -->
    <form name="roots-connect-2026" method="post" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="roots-connect-2026">
      <input name="bot-field">
      <input name="full-name">
      <select name="organisation">
        <option>Roots Hospitality International</option>
        <option>Key Architects</option>
      </select>
      <input name="department">
    </form>
  </body>
</html>
